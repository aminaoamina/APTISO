services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: aptiso-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aptiso
      POSTGRES_PASSWORD: aptiso
      POSTGRES_DB: aptiso
    ports:
      - "5432:5432"
    volumes:
      - aptiso-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aptiso -d aptiso"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: aptiso-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - aptiso-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # AI service (apps/ai, FastAPI). Internal: published on 127.0.0.1 only, for the backend.
  # Start with:  docker compose --profile ai up -d --build
  ai:
    build: ./apps/ai
    container_name: aptiso-ai
    restart: unless-stopped
    profiles: ["ai"]
    env_file: ./apps/ai/.env
    environment:
      # Inside Docker the databases are reached by service name.
      AI_DB_HOST: postgres
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # MinIO - object storage, needed from Sprint 3 (document storage / evidence).
  # Start on demand with:  docker compose --profile minio up -d
  minio:
    image: minio/minio:latest
    container_name: aptiso-minio
    restart: unless-stopped
    profiles: ["minio"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aptiso
      MINIO_ROOT_PASSWORD: aptiso-minio-secret
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console (http://localhost:9001)
    volumes:
      - aptiso-minio-data:/data

volumes:
  aptiso-postgres-data:
  aptiso-redis-data:
  aptiso-minio-data:
